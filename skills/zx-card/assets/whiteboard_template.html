<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zx-card Whiteboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Kalam', 'Noto Sans SC', cursive;
      background: #f8f8f6;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(0,0,0,0.02) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0,0,0,0.02) 0%, transparent 50%);
      color: #2d2d2d;
      padding: 50px;
      min-height: 100vh;
    }

    .whiteboard {
      max-width: 980px;
      margin: 0 auto;
    }

    .title {
      font-size: 38px;
      font-weight: 700;
      margin-bottom: 40px;
      color: #1a1a1a;
      transform: rotate(-1deg);
    }

    .wb-content {
      position: relative;
    }

    .wb-box {
      background: #fff;
      border: 3px solid #2d2d2d;
      border-radius: 12px;
      padding: 24px;
      margin: 24px 0;
      box-shadow: 4px 4px 0 rgba(0,0,0,0.1);
      position: relative;
    }

    .wb-box::before {
      content: '';
      position: absolute;
      top: -3px;
      left: 20px;
      right: 20px;
      height: 3px;
      background: #f5a623;
    }

    .wb-arrow {
      width: 80px;
      height: 4px;
      background: #ff6b6b;
      margin: 30px auto;
      position: relative;
      transform: rotate(-3deg);
      border-radius: 2px;
    }

    .wb-arrow::after {
      content: '';
      position: absolute;
      right: -10px;
      top: -6px;
      border: 8px solid transparent;
      border-left: 14px solid #ff6b6b;
    }

    .highlight-yellow {
      background: rgba(255,235,59,0.4);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .highlight-pink {
      background: rgba(255,107,107,0.2);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .highlight-cyan {
      background: rgba(78,205,196,0.2);
      padding: 2px 6px;
      border-radius: 3px;
    }

    .marker-circle {
      border: 3px solid #ff6b6b;
      border-radius: 50%;
      padding: 8px 16px;
      display: inline-block;
      transform: rotate(-2deg);
    }

    .marker-underline {
      border-bottom: 4px solid #f5a623;
      padding-bottom: 2px;
    }

    .footer {
      margin-top: 50px;
      padding-top: 24px;
      border-top: 3px dashed rgba(0,0,0,0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: rgba(0,0,0,0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 24px;
      height: 24px;
      background: #2d2d2d;
      border-radius: 4px;
      transform: rotate(5deg);
    }
  </style>
</head>
<body>
  <div class="whiteboard">
    <h1 class="title">{{TITLE}}</h1>
    <div class="wb-content">
      {{CONTENT}}
    </div>
    <div class="footer">
      <div class="brand">
        <div class="brand-logo"></div>
        <span>zx</span>
      </div>
      {{SOURCE_LINE}}
    </div>
  </div>
</body>
</html>
