<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zx-card Long</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Serif SC', Georgia, serif;
      background: #1a1a1a;
      color: #e8e8e8;
      line-height: 1.7;
      padding: 60px;
      min-height: 100vh;
    }

    .card {
      max-width: 960px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 40px;
      padding-bottom: 30px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .title {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 16px;
      letter-spacing: 0.02em;
    }

    .content {
      font-size: 17px;
      line-height: 1.8;
    }

    .content p {
      margin-bottom: 20px;
    }

    .content h2 {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      margin: 36px 0 20px 0;
      padding-bottom: 10px;
      border-bottom: 2px solid rgba(255,255,255,0.15);
    }

    .content h3 {
      font-family: 'Noto Sans SC', sans-serif;
      font-size: 18px;
      font-weight: 600;
      color: rgba(255,255,255,0.9);
      margin: 28px 0 14px 0;
    }

    .content blockquote {
      border-left: 3px solid #f5a623;
      padding: 16px 24px;
      margin: 24px 0;
      background: rgba(255,255,255,0.03);
      font-style: italic;
    }

    .content strong {
      color: #f5a623;
      font-weight: 600;
    }

    .content ul, .content ol {
      margin: 20px 0;
      padding-left: 28px;
    }

    .content li {
      margin-bottom: 10px;
    }

    .footer {
      margin-top: 50px;
      padding-top: 24px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 20px;
      height: 20px;
      background: linear-gradient(135deg, #f5a623, #ff6b6b);
      border-radius: 4px;
    }

    .source {
      color: rgba(255,255,255,0.3);
    }

    /* Light theme variant */
    body.light {
      background: #f8f6f3;
      color: #2d2d2d;
    }

    body.light .title {
      color: #1a1a1a;
    }

    body.light .content h2 {
      color: #1a1a1a;
      border-bottom-color: rgba(0,0,0,0.1);
    }

    body.light .content h3 {
      color: rgba(0,0,0,0.8);
    }

    body.light .content blockquote {
      background: rgba(0,0,0,0.03);
    }

    body.light .footer {
      border-top-color: rgba(0,0,0,0.08);
      color: rgba(0,0,0,0.4);
    }

    body.light .source {
      color: rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1 class="title">{{TITLE}}</h1>
    </div>
    <div class="content">
      {{CONTENT}}
    </div>
    <div class="footer">
      <div class="brand">
        <div class="brand-logo"></div>
        <span>zx</span>
      </div>
      {{SOURCE_LINE}}
    </div>
  </div>
</body>
</html>
