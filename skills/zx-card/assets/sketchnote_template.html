<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zx-card Sketchnote</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: #f5f3f0;
      color: #2d2d2d;
      padding: 50px;
      min-height: 100vh;
    }

    .sketchnote {
      max-width: 980px;
      margin: 0 auto;
      position: relative;
    }

    .title {
      font-family: 'ZCOOL XiaoWei', serif;
      font-size: 42px;
      color: #1a1a1a;
      margin-bottom: 40px;
      transform: rotate(-1deg);
    }

    .sketch-content {
      /* Hand-drawn style elements */
    }

    .sketch-box {
      background: #fff;
      border: 2px solid #2d2d2d;
      border-radius: 8px;
      padding: 20px;
      margin: 20px 0;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
      transform: rotate(0.5deg);
    }

    .sketch-arrow {
      width: 60px;
      height: 3px;
      background: #ff6b6b;
      margin: 20px auto;
      position: relative;
      transform: rotate(-2deg);
    }

    .sketch-arrow::after {
      content: '';
      position: absolute;
      right: -8px;
      top: -5px;
      border: 6px solid transparent;
      border-left: 10px solid #ff6b6b;
    }

    .highlight-marker {
      background: linear-gradient(180deg, transparent 60%, rgba(245,166,35,0.4) 60%);
      padding: 0 4px;
    }

    .footer {
      margin-top: 50px;
      padding-top: 24px;
      border-top: 2px dashed rgba(0,0,0,0.2);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      color: rgba(0,0,0,0.4);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 24px;
      height: 24px;
      background: #2d2d2d;
      border-radius: 50%;
      transform: rotate(-5deg);
    }
  </style>
</head>
<body>
  <div class="sketchnote">
    <h1 class="title">{{TITLE}}</h1>
    <div class="sketch-content">
      {{CONTENT}}
    </div>
    <div class="footer">
      <div class="brand">
        <div class="brand-logo"></div>
        <span>zx</span>
      </div>
      {{SOURCE_LINE}}
    </div>
  </div>
</body>
</html>
